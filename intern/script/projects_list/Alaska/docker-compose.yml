services:
  db:
    image: postgres:15-alpine
    container_name: alaska_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alaska
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alaska"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c synchronous_commit=off


  api:
    build: ./backend
    container_name: alaska_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@pgbouncer:6432/alaska?pgbouncer=true
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

  redis:
    image: redis:7-alpine
    container_name: alaska_redis
    restart: always
    ports:
      - "6380:6379"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: alaska_pgbouncer
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/alaska
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=500
      - POOL_MODE=transaction
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy

  chat-gateway:
    build: ./chat-gateway
    deploy:
      replicas: 5
    restart: always
    environment:
      - PORT=4001
      - WORKER_URL=http://chat-worker:4002
      - REDIS_URL=redis://redis:6379
      - INTERNAL_API_KEY=dev_secret_key_123
      - JWT_SECRET=supersecret_jwt_key_for_local_dev
    depends_on:
      - redis
      - chat-worker
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    command: npm run dev
    volumes:
      - ./chat-gateway:/app
      - /app/node_modules

  chat-worker:
    build: ./chat-worker
    deploy:
      replicas: 5
    restart: always
    environment:
      - PORT=4002
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:password@pgbouncer:6432/alaska?pgbouncer=true&connection_limit=50
      - INTERNAL_API_KEY=dev_secret_key_123
      - JWT_SECRET=supersecret_jwt_key_for_local_dev
    depends_on:
      redis:
        condition: service_started
      pgbouncer:
        condition: service_started
      db:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    command: npm run dev
    volumes:
      - ./chat-worker:/app
      - /app/node_modules

  lb:
    image: nginx:alpine
    container_name: alaska_lb
    restart: always
    ports:
      - "4001:4001"
      - "4002:4002"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-gateway
      - chat-worker

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: alaska_frontend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - VITE_API_URL=http://localhost:3000/api
      - VITE_CHAT_WORKER_URL=http://localhost:4002/api
      - VITE_CHAT_GATEWAY_URL=http://localhost:4001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
      - chat-gateway
      - chat-worker

volumes:
  pgdata:
